<style>
:root {
  color-scheme: light;
  --ink: #252b36;
  --link: #265abf;
  --paper: #fffdf7;
  --line: #ccd6e3;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 24px; }
body {
  margin: 0;
  background: #faf8f1;
  color: var(--ink);
  font: 16px/1.85 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}
main { width: min(980px, 100%); margin: auto; padding: 32px 28px 72px; }
article { min-width: 0; }
a { color: var(--link); text-underline-offset: 4px; }
:focus-visible { outline: 3px solid var(--link); outline-offset: 4px; }
.skip-link { position: absolute; top: -100px; left: 12px; padding: 10px 16px; background: var(--paper); z-index: 1; }
.skip-link:focus { top: 12px; }
h1, h2, h3, h4, h5, h6 { line-height: 1.45; overflow-wrap: anywhere; scroll-margin-top: 24px; }
h1 { margin: 20px 0 28px; font-size: clamp(28px, 5vw, 40px); }
h2 { margin: 42px 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--line); font-size: 25px; }
h3 { margin-top: 28px; font-size: 21px; }
h4 { font-size: 18px; }
h5, h6 { font-size: 16px; }
p, li, td, th, a { overflow-wrap: anywhere; }
p { margin: 16px 0; }
li { margin: 7px 0; }
ul, ol { padding-left: 28px; }
li > p { margin: 8px 0; }
blockquote { margin: 22px 0; border-left: 3px solid #7ea2cd; padding: 4px 20px; background: #f0f4f8; }
hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }
pre {
  background: #192232;
  color: #edf1f7;
  padding: 20px;
  border-radius: 10px;
  max-width: 100%;
  overflow-x: auto;
  line-height: 1.65;
  font-size: 14px;
  tab-size: 2;
}
code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
pre code { white-space: pre; overflow-wrap: normal; word-break: normal; }
:not(pre) > code { background: #e9eef5; padding: 2px 5px; border-radius: 4px; overflow-wrap: anywhere; }
img { display: block; max-width: 100%; height: auto; margin: 20px auto; }
.table-scroll { max-width: 100%; overflow-x: auto; margin: 22px 0; border: 1px solid var(--line); border-radius: 6px; }
table { width: 100%; border-collapse: collapse; background: var(--paper); font-size: 14px; line-height: 1.7; }
th, td { min-width: 105px; padding: 12px 14px; border: 1px solid var(--line); text-align: left; }
th { background: #eaf0f7; }
@media (max-width: 600px) {
  main { padding: 20px 16px 40px; }
  h2 { font-size: 22px; }
  pre { padding: 14px; }
  ul, ol { padding-left: 24px; }
  blockquote { padding: 4px 14px; }
}
@media print {
  body { background: #fff; }
  main { width: 100%; padding: 0; }
  .skip-link { display: none; }
  pre { white-space: pre-wrap; }
  pre code { white-space: pre-wrap; overflow-wrap: anywhere; }
  .table-scroll { overflow: visible; }
  th, td { min-width: 0; }
}
</style>
