<script>
/* 轻量代码高亮：注释(# 或行内 //)变暗、字符串变绿、常见关键字变紫（Tokyo Night 配色），
   并把 <code> 的 language-* 类映射为窗口标题栏的 data-lang 标签（text/plain 类不显示）。 */
(function () {
  var KW = "const|let|var|function|return|await|async|import|from|export|new|if|else|for|while|def|class|true|false|null|undefined";
  document.querySelectorAll("pre>code").forEach(function (c) {
    var lm = c.className.match(/language-([\w#+.-]+)/);
    if (lm && !/^(text|plaintext|txt|plain)$/i.test(lm[1])) c.parentElement.setAttribute("data-lang", lm[1]);
    var walker = document.createTreeWalker(c, NodeFilter.SHOW_TEXT), texts = [], node;
    while (walker.nextNode()) texts.push(walker.currentNode);
    texts.forEach(function (t) {
      var s = t.nodeValue;
      if (!s || !/[#'"]/.test(s)) return;
      var re = new RegExp('("(?:[^"\\\\\\n]|\\\\.)*"|\'(?:[^\'\\\\\\n]|\\\\.)*\')|\\b(' + KW + ')\\b|((#|//)[^\\n]*)', 'g');
      var frag = document.createDocumentFragment(), last = 0, m;
      while ((m = re.exec(s))) {
        var cls = m[1] ? "st" : (m[2] ? "kw" : null);
        if (!cls) {
          var prev = m.index > 0 ? s.charAt(m.index - 1) : " ";
          if (/\s/.test(prev)) cls = "cm";
          else { re.lastIndex = m.index + 1; continue; }
        }
        if (m.index > last) frag.appendChild(document.createTextNode(s.slice(last, m.index)));
        var el = document.createElement("span");
        el.className = cls;
        el.textContent = m[0];
        frag.appendChild(el);
        last = m.index + m[0].length;
      }
      if (!last) return;
      if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
      t.parentNode.replaceChild(frag, t);
    });
  });
})();
</script>
