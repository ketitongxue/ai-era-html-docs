</main><script>
(function(){
var KW="const|let|var|function|return|await|async|import|from|export|new|if|else|for|while|def|class|true|false|null|undefined";
document.querySelectorAll("pre>code").forEach(function(c){
var lm=c.className.match(/language-([\w#+.-]+)/);
if(lm&&!/^(text|plaintext|txt)$/i.test(lm[1]))c.parentElement.setAttribute("data-lang",lm[1]);
var w=document.createTreeWalker(c,NodeFilter.SHOW_TEXT),ts=[],n;
while(w.nextNode())ts.push(w.currentNode);
ts.forEach(function(t){
var s=t.nodeValue;
if(!s||!/[#'"]/.test(s))return;
var re=new RegExp('("(?:[^"\\\\\\n]|\\\\.)*"|\'(?:[^\'\\\\\\n]|\\\\.)*\')|\\b('+KW+')\\b|((#|//)[^\\n]*)','g');
var f=document.createDocumentFragment(),last=0,m;
while((m=re.exec(s))){
var cls=m[1]?"st":(m[2]?"kw":null);
if(!cls){
var p=m.index>0?s.charAt(m.index-1):" ";
if(/\s/.test(p))cls="cm";
else{re.lastIndex=m.index+1;continue}
}
if(m.index>last)f.appendChild(document.createTextNode(s.slice(last,m.index)));
var el=document.createElement("span");el.className=cls;el.textContent=m[0];f.appendChild(el);
last=m.index+m[0].length;
}
if(!last)return;
if(last<s.length)f.appendChild(document.createTextNode(s.slice(last)));
t.parentNode.replaceChild(f,t);
});
});
})();
