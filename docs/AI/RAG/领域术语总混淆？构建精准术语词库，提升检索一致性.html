<h1 id="领域术语总混淆构建精准术语词库提升检索一致性">领域术语总混淆？构建精准术语词库，提升检索一致性</h1>
<h2 id="产生术语混淆的原因">产生术语混淆的原因</h2>
<ul>
<li>术语多义性</li>
<li>同义词与近义词</li>
<li>领域差异</li>
<li>企业专属术语</li>
</ul>
<h2 id="国检术语词库的目标">国检术语词库的目标</h2>
<p>术语词库是整个术语一致性优化体系的核心基础设施。</p>
<h2 id="术语词库的构建流程">术语词库的构建流程</h2>
<ol>
<li>收集术语来源</li>
<li>标准化术语</li>
<li>建立别名映射关系</li>
<li>添加上下文信息</li>
<li>构建术语索引</li>
</ol>
<p><img src="../../../assets/md-images/QSPGb2kRFoddogxkpdBcnBHnnwg.png" alt="图片展示了构建术语词库时应包含的关键字段示例，以确保其结构化和可操作性。字段包括术语、别名、定义、上下文标签、所属领域、示例用法、外部链接、禁用词等，如术语为“神经网络”，别名有“人工神经网络”“NN”，定义为一种计算模型等。该图与上下文紧密相关，是对术语词库构建流程中“标准化术语”步骤的具体说明，为构建精准术语词库提供参考。"></p>
<h2 id="术语词库与-rag-集成">术语词库与 RAG 集成</h2>
<ol>
<li>预处理阶段替换术语</li>
<li>检索增强</li>
<li>重排序（Re-ranking）</li>
<li>后处理解释</li>
</ol>
<p><img src="../../../assets/md-images/STJzbPXCzobGduxkkHncvZTen4v.png" alt="图片为“术语一致性优化路线图”，总结了从数据预处理到评估反馈的术语一致性技术体系构建。分为基础核心、关键增强、辅助优化、生成控制、长期保障五个优化层级，对应核心技术与解决方案，如基础核心层的术语词库构建、关键增强层的混合检索等。该图与上下文紧密相关，是对术语词库构建流程及与RAG集成各阶段技术的系统性总结，直观呈现各阶段技术定位与优先级，为RAG系统建设提供实践指引。"></p>

<script>
/* 轻量代码高亮：注释(# 或行内 //)变暗、字符串变绿、常见关键字变紫（Tokyo Night 配色），
   并把 <code> 的 language-* 类映射为窗口标题栏的 data-lang 标签（text/plain 类不显示）。 */
(function () {
  var KW = "const|let|var|function|return|await|async|import|from|export|new|if|else|for|while|def|class|true|false|null|undefined";
  document.querySelectorAll("pre>code").forEach(function (c) {
    var lm = c.className.match(/language-([\w#+.-]+)/);
    if (lm && !/^(text|plaintext|txt|plain)$/i.test(lm[1])) c.parentElement.setAttribute("data-lang", lm[1]);
    var walker = document.createTreeWalker(c, NodeFilter.SHOW_TEXT), texts = [], node;
    while (walker.nextNode()) texts.push(walker.currentNode);
    texts.forEach(function (t) {
      var s = t.nodeValue;
      if (!s || !/[#'"]/.test(s)) return;
      var re = new RegExp('("(?:[^"\\\\\\n]|\\\\.)*"|\'(?:[^\'\\\\\\n]|\\\\.)*\')|\\b(' + KW + ')\\b|((#|//)[^\\n]*)', 'g');
      var frag = document.createDocumentFragment(), last = 0, m;
      while ((m = re.exec(s))) {
        var cls = m[1] ? "st" : (m[2] ? "kw" : null);
        if (!cls) {
          var prev = m.index > 0 ? s.charAt(m.index - 1) : " ";
          if (/\s/.test(prev)) cls = "cm";
          else { re.lastIndex = m.index + 1; continue; }
        }
        if (m.index > last) frag.appendChild(document.createTextNode(s.slice(last, m.index)));
        var el = document.createElement("span");
        el.className = cls;
        el.textContent = m[0];
        frag.appendChild(el);
        last = m.index + m[0].length;
      }
      if (!last) return;
      if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
      t.parentNode.replaceChild(frag, t);
    });
  });
})();
</script>
