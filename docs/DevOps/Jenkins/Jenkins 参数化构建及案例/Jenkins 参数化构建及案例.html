<h1 id="jenkins-参数化构建及案例">Jenkins 参数化构建及案例</h1>
<p>参数使用案例</p>
<p>实战案例：基于Docker系统实现代码自动发布和回滚</p>
<p><img src="../../../../assets/wiki-img/LqNabyxjQoXEDRx5O6zcIUSUnSc.jpeg" alt="图片展示的是Jenkins中“magedu-app1-deploy-test1”项目的“Configuration”页面。在“参数化构建过程”部分，有“选择参数”和“字符串参数”两类参数设置。选择参数中，名称为“METHOD”，选项有“deploy”和“rollback_last_version”，描述为“部署—部署代码到最新版本；回滚代码到上一个版本”。字符串参数中，名称为“BRANCH”，默认值为“develop”。该图片与上下文介绍的Jenkins参数化构建及代码自动发布和回滚案例相关，展示了参数设置情况。"></p>
<p><img src="../../../../assets/wiki-img/ToRTb92zQoJuGJxFhNscoBzenif.jpeg" alt="图片展示了Jenkins参数化构建中的“执行shell”步骤配置界面。界面中显示命令为“bash /data/scripts/magedu-appl-deploy.sh $METHOD $BRANCH”，其中$METHOD和$BRANCH为参数变量。该图片与文档中基于Docker系统实现代码自动发布和回滚的实战案例相关，用于说明在Jenkins中通过执行shell脚本实现代码部署的具体操作，体现了参数化构建在自动化运维中的应用。"></p>
<p><img src="../../../../assets/wiki-img/LDzdbLAyYoTUVZxkvXicB2aen6g.jpeg" alt="图片展示的是Jenkins参数化构建的代码自动发布和回滚实战案例中，基于Docker系统部署nginx的测试结果界面。界面中显示了多个构建步骤，如添加环境变量、添加源码列表、添加nginx源码、添加nginx配置文件、添加nginx前端tar包等，每个步骤后有对应的执行结果，如“Using cache”“Using cache”等，还显示了构建耗时、构建状态等信息。该图片直观呈现了代码自动发布和回滚的构建过程及结果。"></p>

<script>
/* 轻量代码高亮：注释(# 或行内 //)变暗、字符串变绿、常见关键字变紫（Tokyo Night 配色），
   并把 <code> 的 language-* 类映射为窗口标题栏的 data-lang 标签（text/plain 类不显示）。 */
(function () {
  var KW = "const|let|var|function|return|await|async|import|from|export|new|if|else|for|while|def|class|true|false|null|undefined";
  document.querySelectorAll("pre>code").forEach(function (c) {
    var lm = c.className.match(/language-([\w#+.-]+)/);
    if (lm && !/^(text|plaintext|txt|plain)$/i.test(lm[1])) c.parentElement.setAttribute("data-lang", lm[1]);
    var walker = document.createTreeWalker(c, NodeFilter.SHOW_TEXT), texts = [], node;
    while (walker.nextNode()) texts.push(walker.currentNode);
    texts.forEach(function (t) {
      var s = t.nodeValue;
      if (!s || !/[#'"]/.test(s)) return;
      var re = new RegExp('("(?:[^"\\\\\\n]|\\\\.)*"|\'(?:[^\'\\\\\\n]|\\\\.)*\')|\\b(' + KW + ')\\b|((#|//)[^\\n]*)', 'g');
      var frag = document.createDocumentFragment(), last = 0, m;
      while ((m = re.exec(s))) {
        var cls = m[1] ? "st" : (m[2] ? "kw" : null);
        if (!cls) {
          var prev = m.index > 0 ? s.charAt(m.index - 1) : " ";
          if (/\s/.test(prev)) cls = "cm";
          else { re.lastIndex = m.index + 1; continue; }
        }
        if (m.index > last) frag.appendChild(document.createTextNode(s.slice(last, m.index)));
        var el = document.createElement("span");
        el.className = cls;
        el.textContent = m[0];
        frag.appendChild(el);
        last = m.index + m[0].length;
      }
      if (!last) return;
      if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
      t.parentNode.replaceChild(frag, t);
    });
  });
})();
</script>
